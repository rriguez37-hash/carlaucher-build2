name: Compilar CarLauncher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Descomprimir y buscar proyecto
        run: |
          unzip -q CarLauncher.zip -d temp_dir
          cd temp_dir
          # Busca la carpeta exacta donde está el archivo 'gradlew'
          PROYECTO_DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROYECTO_DIR" ]; then
            echo "❌ ERROR FATAL: No se encontró el archivo 'gradlew' dentro del ZIP."
            exit 1
          fi
          
          echo "✅ Proyecto encontrado en: $PROYECTO_DIR"
          # Mueve todo a la raíz del repositorio
          mv "$PROYECTO_DIR"/* $GITHUB_WORKSPACE/
          mv "$PROYECTO_DIR"/.* $GITHUB_WORKSPACE/ 2>/dev/null || true

      - name: 5. Arreglar Gradle y permisos
        run: |
          # Convierte finales de línea de Windows a Linux y da permisos
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: 6. Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 7. Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLauncher-APK
          path: app/build/outputs/apk/debug/*.apk
